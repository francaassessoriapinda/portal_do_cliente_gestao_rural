<style>
:root{--azul:#1C3B67;--azul-2:#12284A;--azul-3:#2B5590;--laranja:#E85B4A;--laranja-2:#C9473A;--papel:#F3F6FA;--tinta:#1B2433;--suave:#5B6B82;--linha:#DCE3ED;--verde:#2F7D5B;--verde-bg:#E5F2EA;--amarelo:#8A5E00;--amarelo-bg:#FFF3D2;--vermelho:#B23A2E;--vermelho-bg:#FCE8E5;--raio:10px}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--papel);color:var(--tinta);font-size:14.5px;line-height:1.55}
.topo{background:linear-gradient(115deg,var(--azul-2),var(--azul) 55%,var(--azul-3));color:#fff;padding:18px 24px 0}
.topo-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:16px}
.marca{display:flex;align-items:center;gap:16px}
.marca img{height:44px;width:auto;display:block}
.marca small{display:block;font-size:13px;color:#C9D5E6;border-left:1px solid rgba(255,255,255,.28);padding-left:16px;line-height:1.3;max-width:180px}
.login .marca{flex-direction:column;align-items:flex-start;gap:6px}
.login .marca img{height:56px}
.login .marca small{color:var(--suave);border:0;padding:0;max-width:none}
.rel-cab img{height:34px;width:auto;display:block;margin-bottom:4px}
.quem{margin-left:auto;font-size:13px;color:#C9D5E6;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.quem button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
nav.abas{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto}
nav.abas button{background:none;border:0;color:#C9D5E6;font:inherit;font-size:14px;padding:10px 16px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap}
nav.abas button[aria-current="page"]{background:var(--papel);color:var(--azul);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
h1{font-size:23px;margin:0 0 4px;color:var(--azul);font-weight:600}
h2{font-size:17px;margin:30px 0 10px;color:var(--azul);font-weight:600}
h3{font-size:15px;margin:20px 0 6px;font-weight:600}
p{margin:0 0 10px}
.sub{color:var(--suave);margin:0 0 22px;max-width:72ch}
.bloco{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:20px}
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.form .campo{flex:1 1 170px}
.campo{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--suave)}
.campo input,.campo select,.campo textarea{font:inherit;font-size:14px;color:var(--tinta);padding:9px 11px;border:1px solid #C6D1DF;border-radius:8px;background:#fff;width:100%}
.campo textarea{min-height:70px;resize:vertical}
:focus-visible{outline:3px solid #F2A69C;outline-offset:2px}
.btn{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:8px;padding:10px 18px;background:var(--laranja);color:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--laranja-2)}
.btn.sec{background:#fff;color:var(--azul);border:1px solid #BFCBDB}
.btn.sec:hover{background:#EEF3F9}
.btn.peq{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:progress}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.tabela{width:100%;overflow-x:auto;border:1px solid var(--linha);border-radius:var(--raio);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--suave);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--linha);background:#F7F9FC;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #EDF1F6;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ent{color:var(--verde)}.sai{color:var(--vermelho)}
tfoot td{font-weight:600;background:#F7F9FC;border-top:2px solid var(--linha)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.ok{background:var(--verde-bg);color:var(--verde)}.rev{background:var(--amarelo-bg);color:var(--amarelo)}.err{background:var(--vermelho-bg);color:var(--vermelho)}.neu{background:#E9EEF5;color:var(--suave)}
.vazio{padding:34px 20px;text-align:center;color:var(--suave)}
/* Total do livro: fechamento com dupla linha, como no livro caixa em papel */
.fecho{display:flex;flex-wrap:wrap;gap:28px 48px;align-items:flex-end;margin:6px 0 22px}
.fecho div{display:flex;flex-direction:column}
.fecho span{font-size:13px;color:var(--suave)}
.fecho b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.fecho .resultado b{font-size:34px;color:var(--azul);border-bottom:4px double var(--azul);padding-bottom:2px;line-height:1.2}
.drop{border:2px dashed #AFC0D6;border-radius:var(--raio);background:#fff;padding:36px 20px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.drop.sobre{background:#EEF3FA;border-color:var(--azul-3)}
.drop strong{display:block;font-size:16px;color:var(--azul);margin-bottom:4px}
.fila{margin-top:16px;display:grid;gap:8px}
.item{background:#fff;border:1px solid var(--linha);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.item .nome{flex:1 1 220px;font-weight:500;word-break:break-word}
.item .det{flex-basis:100%;font-size:13px;color:var(--suave)}
.aviso{background:#fff;border:1px solid var(--linha);border-left:6px solid var(--azul-3);border-radius:var(--raio);padding:14px 18px;margin-bottom:22px}
.aviso.atencao{border-left-color:#D9A21B}.aviso.urgente{border-left-color:var(--laranja)}
.aviso strong{display:block;color:var(--azul);margin-bottom:2px}
.links-of{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links-of a{font-size:13px;padding:6px 12px;border-radius:20px;text-decoration:none;background:#EEF3F9;color:var(--azul);border:1px solid #C9D5E6}
.msg{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:16px 18px;margin-bottom:12px}
.msg h3{margin:0 0 4px;color:var(--azul)}.msg time{font-size:12.5px;color:var(--suave)}
.msg p{margin:8px 0 0}
nav.abas .conta{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--laranja);color:#fff;font-size:11.5px;line-height:18px;text-align:center}
.guia{max-width:78ch}
.guia li{margin-bottom:6px}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(115deg,var(--azul-2),var(--azul) 55%,var(--azul-3));padding:24px}
.login .cartao{background:#fff;border-radius:14px;padding:30px;width:100%;max-width:380px;display:grid;gap:14px}
.erro-msg{color:var(--vermelho);font-size:13px;min-height:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--azul-2);color:#fff;padding:11px 18px;border-radius:9px;font-size:14px;display:none;max-width:90vw;z-index:20}
#toast.erro{background:var(--vermelho)}
.rel-cab{display:none}
@media (max-width:640px){main{padding:20px 14px 50px}.topo{padding:14px 14px 0}.fecho .resultado b{font-size:28px}}
.tipos-rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:4px 0 8px}
.tipos-rel button{font:inherit;text-align:left;background:#fff;border:2px solid var(--linha);border-radius:var(--raio);padding:14px 16px;cursor:pointer;color:var(--tinta);display:flex;gap:12px;align-items:flex-start}
.tipos-rel button:hover{border-color:#9FB3CF}
.tipos-rel button[aria-checked="true"]{border-color:var(--laranja);background:#FFF6F4;box-shadow:0 2px 10px rgba(232,91,74,.15)}
.tipos-rel svg{flex:0 0 30px;color:var(--azul-3)}.tipos-rel button[aria-checked="true"] svg{color:var(--laranja)}
.tipos-rel b{display:block;font-size:15px;color:var(--azul);margin-bottom:2px}.tipos-rel small{color:var(--suave);font-size:12.5px;line-height:1.35;display:block}
.rotulo-passo{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin:14px 0 6px}
.sint-graf{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px 6px;margin-bottom:14px}
.sint-graf .graf{max-width:860px;margin:0 auto}
@media print{.sint-graf{break-inside:avoid;margin-bottom:10px}
  .topo,.nao-imprimir,#toast{display:none!important}
  body{background:#fff;font-size:11.5px}
  main{padding:0;max-width:none}
  .tabela{border:0;overflow:visible}
  th,td{padding:5px 6px}
  .rel-cab{display:flex;justify-content:space-between;border-bottom:2px solid var(--azul);padding-bottom:8px;margin-bottom:12px}
  tr{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.versao{font-size:11px;color:#A9BBD2;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:1px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tiles div{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tiles span{font-size:13px;color:var(--suave)}.tiles b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--tinta)}
.tiles .destaque b{color:var(--azul);border-bottom:3px double var(--azul);align-self:flex-start}
.mini-barra{display:block;height:6px;background:#E6ECF4;border-radius:4px;overflow:hidden;margin-top:6px}.mini-barra i{display:block;height:100%;background:var(--azul-3)}
.cartao-graf{margin-top:16px;padding:16px 18px}.cartao-graf h2{margin:0;font-size:15.5px}
.graf-cab{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.legenda{display:flex;gap:14px;font-size:13px;color:var(--suave)}.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.graf{width:100%;height:auto;display:block;font-family:inherit}.graf .eixo{font-size:11px;fill:#6B7A90}.graf .rot{font-size:12px;fill:var(--tinta);font-weight:600}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.duas .cartao-graf{margin-top:16px}
.hbar{display:grid;gap:9px;margin-top:4px}.hb-l{display:grid;grid-template-columns:minmax(110px,40%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb-n{color:var(--tinta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb-t{height:12px;background:#F1F4F8;border-radius:0 4px 4px 0}.hb-t i{display:block;height:100%;background:var(--laranja);border-radius:0 4px 4px 0}
.hb-v{color:var(--suave);font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.tabela-graf{margin-top:10px}.tabela-graf summary{font-size:13px;color:var(--azul-3);cursor:pointer}
#tipG{position:fixed;z-index:40;display:none;background:#12284A;color:#fff;font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:7px;pointer-events:none;box-shadow:0 6px 20px rgba(18,40,74,.25)}
.faixa-vis{background:#FFF3D2;color:#5E4200;font-size:13.5px;padding:9px 24px;text-align:center;border-bottom:1px solid #E9C977}.faixa-vis button{margin-left:10px;font:inherit;font-size:13px;background:#fff;border:1px solid #D9B45C;border-radius:6px;padding:3px 10px;cursor:pointer}

.botoes-envio{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.btn.grande{display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;font-size:16px;border-radius:12px}
.btn.grande small{display:block;font-size:12.5px;font-weight:400;opacity:.85;margin-top:2px}
.btn.grande.sec small{color:var(--suave)}
.grande-env{width:100%;padding:14px 18px;font-size:16px;border-radius:12px}
.miniatura{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--linha)}
.icone-arq{width:52px;height:52px;border-radius:6px;background:#EEF3F9;color:var(--azul);display:grid;place-items:center;font-size:12px;font-weight:600}
.item{align-items:center}.item .nome{flex:1 1 160px}
.dicas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}
.dicas>div{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:14px 18px}
.dicas h3{margin:6px 0 6px;color:var(--azul);font-size:14.5px}.dicas ul{margin:0 0 8px;padding-left:18px;font-size:13.5px}.dicas li{margin-bottom:4px}
@media (max-width:640px){.btn.grande{padding:18px}}
</style>

async function api(acao, dados){
  if (!API_URL || API_URL.indexOf('COLE_') === 0) throw new Error('Portal ainda não configurado: falta a URL do servidor (API_URL).');
  const r = await fetch(API_URL, {method:'POST', body: JSON.stringify({acao, token: TOKEN, dados})});
  const j = await r.json();
  if (!j.ok){ if (j.codigo === 'SESSAO'){ sair(); } throw new Error(j.erro || 'Erro no servidor.'); }
  return j.dados;
}
function toast(msg, erro){ const t=$('#toast'); t.textContent=msg; t.className=erro?'erro':''; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none', erro?6000:3500); }

function telaLogin(msg){

    <label class="campo">Senha<input name="senha" type="password" autocomplete="current-password" required></label>
    <div class="erro-msg" id="lErro">${esc(msg||'')}</div>
    <button class="btn" type="submit">Entrar</button>
    <small style="color:var(--suave)">Esqueceu a senha? Fale com a França Assessoria para gerar uma nova.</small>
  </form></div>`;
  $('#fLogin').onsubmit = async e => {
    e.preventDefault(); const f=e.target, b=f.querySelector('button'); b.disabled=true; $('#lErro').textContent='';
    try{
      const r = await api('login',{tipo:'cliente', usuario:f.cpf.value, senha:f.senha.value});

      if (r.trocarSenha) telaTrocaSenha(true); else iniciar();

function telaTrocaSenha(obrigatoria){

const EXT_ACEITAS=/\.(pdf|xml|jpe?g|png|webp|heic|heif)$/i;
async function adicionarFila(files, daCamera){
  for(const f of files){
    if(!EXT_ACEITAS.test(f.name) && !/^image\//.test(f.type)){ toast(f.name+': formato não aceito. Envie PDF, XML ou foto.',true); continue; }
    const it={ id:Math.random().toString(36).slice(2), f, nome:f.name, st:'pendente', foto:/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name) };
    S.filaEnvio.push(it); desenharFila();
    if(it.foto){ try{ Object.assign(it, await prepararFoto(f, daCamera)); }catch(e){ it.aviso='Não foi possível otimizar a foto; ela será enviada como está.'; } desenharFila(); }
    else if(f.size>15*1048576){ it.st='grande'; desenharFila(); }
  }
}
// Reduz o tamanho da foto (mantendo legível) e verifica nitidez e iluminação
async function prepararFoto(f, daCamera){
  const url=URL.createObjectURL(f);
  try{
    const img=await new Promise((ok,er)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>er(new Error('imagem')); i.src=url; });
    const max=2400, k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.86));
    // nitidez (variação do Laplaciano) e brilho numa versão pequena
    const w=400, h=Math.max(1,Math.round(cv.height*w/cv.width)), c2=document.createElement('canvas'); c2.width=w; c2.height=h;
    const x2=c2.getContext('2d'); x2.drawImage(cv,0,0,w,h); const d=x2.getImageData(0,0,w,h).data;
    const g=new Float32Array(w*h); let soma=0; for(let i=0;i<w*h;i++){ g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]; soma+=g[i]; }
    let m=0,m2=0,n=0; for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x, L=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w]; m+=L; m2+=L*L; n++; }
    const varL=m2/n-(m/n)**2, brilho=soma/(w*h);
    const avisos=[]; if(varL<60) avisos.push('a foto parece tremida ou fora de foco'); if(brilho<70) avisos.push('a foto está escura');
    const nome=f.name.replace(/\.(heic|heif|png|webp|jpe?g)$/i,'')+'.jpg';
    return { arquivo:new File([blob], nome, {type:'image/jpeg'}), nome, thumb:URL.createObjectURL(blob), aviso: avisos.length?'Atenção: '+avisos.join(' e ')+'. Se puder, tire outra foto.':'' };
  } finally { URL.revokeObjectURL(url); }
}
function desenharFila(){

    return `<div class="item">${x.thumb?`<img src="${x.thumb}" alt="" class="miniatura">`:`<span class="icone-arq">${/\.xml$/i.test(x.nome)?'XML':/\.pdf$/i.test(x.nome)?'PDF':'ARQ'}</span>`}
      <span class="nome">${esc(x.nome)}</span>${st}${x.st==='pendente'?`<button class="btn sec peq" type="button" data-rm="${x.id}" aria-label="Remover ${esc(x.nome)}">Remover</button>`:''}${det}</div>`; }).join('')}</div>`:'';
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ S.filaEnvio=S.filaEnvio.filter(x=>x.id!==b.dataset.rm); desenharFila(); });

  if(S.enviando){ bt.disabled=true; bt.textContent='Enviando… aguarde'; }

  else { bt.disabled=true; bt.textContent=L.some(x=>x.r)?'Enviado! Pode enviar mais documentos acima':'Escolha ou fotografe os documentos'; }

let _jspdf=null;
function carregarJsPDF(){ if(window.jspdf) return Promise.resolve(window.jspdf); if(!_jspdf) _jspdf=new Promise((ok,er)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; s.onload=()=>ok(window.jspdf); s.onerror=()=>er(new Error('Não foi possível juntar as fotos.')); document.head.appendChild(s); }); return _jspdf; }
async function fotosEmPdf(itens){
  const { jsPDF }=await carregarJsPDF(); let doc=null;
  for(const it of itens){
    const src=it.thumb||URL.createObjectURL(it.arquivo||it.f);
    const img=await new Promise((ok,er)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=er; i.src=src; });
    const o=img.width>img.height?'l':'p';
    if(!doc) doc=new jsPDF({orientation:o, unit:'pt', format:'a4'}); else doc.addPage('a4', o);
    const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), k=Math.min((W-24)/img.width,(H-24)/img.height);
    doc.addImage(img,'JPEG',(W-img.width*k)/2,(H-img.height*k)/2,img.width*k,img.height*k);
  }
  return new File([doc.output('blob')], 'nota-'+new Date().toISOString().slice(0,10)+'-'+itens.length+'-paginas.pdf', {type:'application/pdf'});
}
async function enviarFila(){
  let pend=S.filaEnvio.filter(x=>x.st==='pendente');
  if(!pend.length) return;
  S.enviando=true; desenharFila();
  try{
    const fotos=pend.filter(x=>x.foto);
    if($('#juntarFotos') && $('#juntarFotos').checked && fotos.length>1){
      const pdf=await fotosEmPdf(fotos);
      S.filaEnvio=S.filaEnvio.filter(x=>!fotos.includes(x)); const novo={id:'pdf'+Date.now(), f:pdf, arquivo:pdf, nome:pdf.name, st:'pendente', foto:false};
      S.filaEnvio.push(novo); pend=S.filaEnvio.filter(x=>x.st==='pendente');
    }
    for(const x of pend){
      const f=x.arquivo||x.f;
      if(f.size>15*1048576){ x.st='grande'; desenharFila(); continue; }
      x.st='enviando'; desenharFila();
      try{ x.r=await api('cli.enviar',{arquivo:{nome:x.nome, mime:f.type, base64:await base64(f)}, codImovel:$('#eIm')?$('#eIm').value:'', codConta:$('#eCt')?$('#eCt').value:'', obs:$('#eObs')?$('#eObs').value:''}); }
      catch(err){ x.erro=err.message; }
      x.st='feito'; desenharFila();
    }
    const ok=pend.filter(x=>x.r&&!x.r.duplicado).length;
    if(ok) toast(ok+' documento(s) enviado(s). O escritório foi avisado.');
  } catch(e){ toast(e.message,true); }
  finally{ S.enviando=false; Object.keys(CACHE_L).forEach(k=>delete CACHE_L[k]); desenharFila(); }
}

function base64(file){
  return new Promise((ok,falha)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=()=>falha(new Error('Não foi possível ler o arquivo.')); r.readAsDataURL(file); });
}

function montarRelatorio(tipo, ls, cli, p){
  const t = totais(ls);
  const titulo = {analitico:'Livro caixa da atividade rural',mensal:'Livro caixa sintético da atividade rural',categoria:'Resumo por tipo de receita e despesa'}[tipo];

    <h2 style="margin-top:0">${esc(titulo)} — ${dataBR(p.ini)} a ${dataBR(p.fim)}</h2>`;
  const rod = `<p style="color:var(--suave);font-size:12px;margin-top:14px">Regime de caixa. Lançamentos “em conferência” ainda podem ser ajustados pelo escritório.</p>`;

    let s=0;
    return cab + `<div class="tabela"><table><thead><tr><th>Data</th><th>Documento</th><th>Histórico</th><th>Participante</th><th>Imóvel</th><th class="v">Entrada</th><th class="v">Saída</th><th class="v">Saldo</th></tr></thead><tbody>${
      ls.map(l=>{ s+=l.entrada-l.saida; return `<tr><td>${dataBR(l.data)}</td><td>${esc(TIPO_DOC[l.tipoDoc]||'')} ${esc(l.numDoc)}</td><td>${esc(l.historico)}</td><td>${esc(l.nomePartic||'')} ${esc(l.idPartic||'')}</td><td>${esc(l.codImovel)}</td><td class="v">${l.entrada?brl(l.entrada):''}</td><td class="v">${l.saida?brl(l.saida):''}</td><td class="v">${brl(s)}</td></tr>`;}).join('')
    }</tbody><tfoot><tr><td colspan="5">Totais do período</td><td class="v">${brl(t.e)}</td><td class="v">${brl(t.s)}</td><td class="v">${brl(t.r)}</td></tr></tfoot></table></div>` + rod;
  }

    // meses exibidos: do 1º mês com movimento (ou início do período) até o último com movimento ou o mês atual, dentro do período
    const ord=Object.keys(m).sort(), mesHoje=hoje().slice(0,7), ks=[];

    else { a=a&&a>mesHoje.slice(0,4)+'-01'?a:''; z=''; }
    if(a&&z){ let [y,mm]=a.split('-').map(Number); for(let i=0;i<120;i++){ const k=y+'-'+String(mm).padStart(2,'0'); if(k>z) break; ks.push(k); mm++; if(mm>12){mm=1;y++;} } }
    ord.forEach(k=>{ if(!ks.includes(k)) ks.push(k); }); ks.sort();
    const NM=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    let ac=0; const linhas=ks.map(k=>{ const v=m[k]||{e:0,s:0}, r=v.e-v.s; ac+=r; return {k,e:v.e,s:v.s,r,ac}; });

  }

}

function baixarCSV(ls, nome){
  if (!ls.length){ toast('Não há lançamentos no período.',true); return; }
  const n = v => Number(v||0).toFixed(2).replace('.',',');
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const linhas = [['Data','Imóvel','Conta','Nº documento','Tipo documento','Histórico','CPF/CNPJ participante','Participante','Tipo lançamento','Categoria','Entrada','Saída','Conferido'].join(';')]
    .concat(ls.map(l=>[dataBR(l.data),l.codImovel,l.codConta,l.numDoc,TIPO_DOC[l.tipoDoc]||'',l.historico,l.idPartic,l.nomePartic,TIPO_LANC[l.tipoLanc]||'',l.categoria,n(l.entrada),n(l.saida),l.conferido?'Sim':'Não'].map(q).join(';')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'})); a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- Padrão: texto digitado em MAIÚSCULAS ---------- */
const NAO_MAIUSC = ['email','senha','atual','nova','conf','usuario','fonte'];
function ehCampoMaiusc(el){
  if(!el || !el.matches || !el.matches('input:not([type]),input[type="text"],input[type="search"],textarea')) return false;
  if(NAO_MAIUSC.includes(el.name) || el.hasAttribute('data-extras') || el.hasAttribute('data-livre')) return false;
  return !el.closest('#fBan,#fM,#fLogin,#fSenha,.login,#vLista');
}
document.addEventListener('input', e=>{ const el=e.target; if(!ehCampoMaiusc(el)) return;
  const v=el.value, u=v.toUpperCase(); if(v===u) return; const p=el.selectionStart; el.value=u; try{ el.setSelectionRange(p,p); }catch(_){} }, true);

/* ---------- Resumo com gráficos ---------- */
const COR_ENT='#2B5590', COR_SAI='#E85B4A';
const MES_C=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const kBRL = v => { const a=Math.abs(v), s=v<0?'−':''; return a>=1e6?s+'R$ '+(a/1e6).toFixed(1).replace('.',',')+' mi':a>=1e3?s+'R$ '+Math.round(a/1e3)+' mil':s+'R$ '+Math.round(a); };
function escalaNice(max){ if(max<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(max))), f=max/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function marcas(lo,hi){ const st=escalaNice(((hi-lo)||1)/4), a=Math.floor(lo/st)*st, b=Math.ceil(hi/st)*st, t=[]; for(let v=a; v<=b+st/2; v+=st) t.push(Math.round(v*100)/100); return t; }
const barraTopo=(x,y,w,h,r)=>{ if(h<=0) return ''; r=Math.min(r,w/2,h); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; };

function grafMensal(e,s,rot){
  rot=rot||MES_C; const n=e.length;
  const W=720,H=260,L=72,R=10,T=14,B=28, iw=W-L-R, ih=H-T-B, tk=marcas(0,Math.max(...e,...s,1)), top=tk[tk.length-1], gw=iw/n, bw=Math.max(3,Math.min(18,(gw-10)/2));
  let g=''; for(const v of tk){ const y=T+ih-ih*v/top; g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E6ECF4"/><text x="${L-8}" y="${y+4}" text-anchor="end" class="eixo">${kBRL(v)}</text>`; }
  let b='', hit='';
  for(let m=0;m<n;m++){ const cx=L+gw*m+gw/2, he=ih*e[m]/top, hs=ih*s[m]/top;
    b+=`<path d="${barraTopo(cx-bw-1,T+ih-he,bw,he,4)}" fill="${COR_ENT}"/><path d="${barraTopo(cx+1,T+ih-hs,bw,hs,4)}" fill="${COR_SAI}"/>`;
    b+=`<text x="${cx}" y="${H-8}" text-anchor="middle" class="eixo">${(n<=12||m%Math.ceil(n/12)===0)?rot[m]:''}</text>`;
    hit+=`<rect x="${L+gw*m}" y="${T}" width="${gw}" height="${ih}" fill="transparent" data-tip="<b>${rot[m]}</b><br>Entradas: ${brl(e[m])}<br>Saídas: ${brl(s[m])}<br>Resultado: ${brl(e[m]-s[m])}"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Entradas e saídas por mês">${g}<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="#B9C6D6"/>${b}${hit}</svg>`;
}
function grafAcumulado(ac){
  const W=480,H=240,L=70,R=14,T=16,B=26, iw=W-L-R, ih=H-T-B;
  const vs=ac.filter(v=>v!==null), tk=marcas(Math.min(0,...vs), Math.max(0,...vs,1)), lo=tk[0], hi=tk[tk.length-1];
  const faixa=(hi-lo)||1, Y=v=>T+ih-(v-lo)/faixa*ih, X=m=>L+iw*(m+.5)/12;
  let g=''; tk.forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E6ECF4"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" class="eixo">${kBRL(v)}</text>`; });
  const ult=ac.reduce((u,v,i)=>v!==null?i:u,-1); const pts=ac.slice(0,ult+1).map((v,m)=>`${X(m)},${Y(v)}`).join(' ');
  let hit=''; for(let m=0;m<12;m++){ if(ac[m]==null) continue; hit+=`<rect x="${L+iw*m/12}" y="${T}" width="${iw/12}" height="${ih}" fill="transparent" data-tip="<b>${MES_C[m]}</b><br>Resultado acumulado: ${brl(ac[m])}" data-cx="${X(m)}" data-cy="${Y(ac[m])}"/>`; }
  const meses=MES_C.map((t,m)=>m%2?'':`<text x="${X(m)}" y="${H-8}" text-anchor="middle" class="eixo">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Resultado acumulado no ano">${g}<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#8C9BB0" stroke-dasharray="3 3"/>
    <polyline points="${pts}" fill="none" stroke="${COR_ENT}" stroke-width="2" stroke-linejoin="round"/>
    ${ult>=0?`<circle cx="${X(ult)}" cy="${Y(ac[ult])}" r="4.5" fill="${COR_ENT}" stroke="#fff" stroke-width="2"/><text x="${X(ult)}" y="${Y(ac[ult])-10}" text-anchor="${ult>8?'end':'start'}" class="rot">${kBRL(ac[ult])}</text>`:''}
    <circle class="ponto" r="4.5" fill="${COR_ENT}" stroke="#fff" stroke-width="2" style="display:none"/>${meses}${hit}</svg>`;
}
function grafCategorias(lista, total){
  if(!lista.length) return '<div class="vazio">Sem despesas no período.</div>';
  const top=lista.slice(0,7), resto=lista.slice(7).reduce((t,x)=>t+x[1],0); if(resto>0) top.push(['Outras',resto]);
  const mx=Math.max(...top.map(x=>x[1]));
  return `<div class="hbar">${top.map(([n,v])=>`<div class="hb-l" data-tip="<b>${esc(n)}</b><br>${brl(v)} · ${(v/total*100).toFixed(1).replace('.',',')}% das despesas"><span class="hb-n">${esc(n)}</span><span class="hb-t"><i style="width:${Math.max(1,v/mx*100)}%"></i></span><span class="hb-v">${kBRL(v)}</span></div>`).join('')}</div>`;
}
function ligarTooltip(raiz){
  let tip=document.getElementById('tipG'); if(!tip){ tip=document.createElement('div'); tip.id='tipG'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip); }
  raiz.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mousemove',ev=>{ tip.innerHTML=el.dataset.tip; tip.style.display='block';
      const x=Math.min(ev.clientX+14, innerWidth-tip.offsetWidth-8), y=Math.max(8, ev.clientY-tip.offsetHeight-12); tip.style.left=x+'px'; tip.style.top=y+'px';
      const svg=el.ownerSVGElement, p=svg&&svg.querySelector('.ponto'); if(p&&el.dataset.cx){ p.setAttribute('cx',el.dataset.cx); p.setAttribute('cy',el.dataset.cy); p.style.display=''; } });
    el.addEventListener('mouseleave',()=>{ tip.style.display='none'; const svg=el.ownerSVGElement, p=svg&&svg.querySelector('.ponto'); if(p) p.style.display='none'; });
  });
}

async function abaResumo(){
  const anoAt=+hoje().slice(0,4); S.anoResumo=S.anoResumo||anoAt;
  $('#conteudo').innerHTML = bannerHtml() + `<h1>Resumo da atividade rural</h1>
    <p class="sub">Entradas e saídas do seu livro caixa, mês a mês, pelo regime de caixa. Passe o mouse ou toque nos gráficos para ver os valores.</p>
    <div class="form"><label class="campo" style="flex:0 1 200px">Ano<select id="rsAno">${[anoAt,anoAt-1,anoAt-2,anoAt-3].map(a=>`<option ${a===S.anoResumo?'selected':''}>${a}</option>`).join('')}</select></label></div>
    <div id="rsCorpo" style="margin-top:18px"><div class="vazio">Carregando…</div></div>`;
  $('#rsAno').onchange=()=>{ S.anoResumo=+$('#rsAno').value; abaResumo(); };
  let ls; try{ ls=await lancsDe({ini:S.anoResumo+'-01-01', fim:S.anoResumo+'-12-31'}); }catch(e){ toast(e.message,true); return; }
  if(!$('#rsCorpo')) return;
  const e=Array(12).fill(0), s=Array(12).fill(0), cat={};
  ls.forEach(l=>{ const m=+l.data.slice(5,7)-1; e[m]+=l.entrada; s[m]+=l.saida; if(l.saida){ const k=l.categoria||'Sem classificação'; cat[k]=(cat[k]||0)+l.saida; } });
  const tE=e.reduce((a,b)=>a+b,0), tS=s.reduce((a,b)=>a+b,0);
  const ultimoMes = S.anoResumo<anoAt?11:+hoje().slice(5,7)-1;
  let acc=0; const ac=e.map((v,m)=>{ acc+=v-s[m]; return m<=ultimoMes?acc:null; });
  const pf=!ehPJ(S.dados.cliente), lim=4800000, pc=tE/lim*100;
  const conf=ls.filter(l=>!l.conferido).length;
  $('#rsCorpo').innerHTML = !ls.length ? '<div class="bloco vazio">Nenhum lançamento neste ano. Envie seus documentos na aba “Enviar documentos”.</div>' : `
    <div class="tiles">
      <div><span>Entradas no ano</span><b style="color:${COR_ENT}">${brl(tE)}</b></div>
      <div><span>Saídas no ano</span><b style="color:${COR_SAI}">${brl(tS)}</b></div>
      <div class="destaque"><span>Resultado do ano</span><b>${brl(tE-tS)}</b></div>
      ${pf?`<div><span>Receita × limite do LCDPR (R$ 4,8 mi)</span><b>${pc.toFixed(1).replace('.',',')}%</b><span class="mini-barra"><i style="width:${Math.min(pc,100)}%"></i></span></div>`
          :`<div><span>Lançamentos no ano</span><b>${ls.length}</b></div>`}
    </div>
    ${conf?`<p class="pequeno" style="margin:8px 0 0">${conf} lançamento(s) ainda em conferência pelo escritório; os valores podem mudar.</p>`:''}
    <section class="bloco cartao-graf"><div class="graf-cab"><h2>Entradas e saídas por mês</h2>
      <div class="legenda"><span><i style="background:${COR_ENT}"></i>Entradas</span><span><i style="background:${COR_SAI}"></i>Saídas</span></div></div>${grafMensal(e,s)}
      <details class="tabela-graf"><summary>Ver em tabela</summary><div class="tabela"><table><thead><tr><th>Mês</th><th class="v">Entradas</th><th class="v">Saídas</th><th class="v">Resultado</th><th class="v">Acumulado</th></tr></thead><tbody>${
        MES_C.map((t,m)=>`<tr><td>${t}</td><td class="v">${brl(e[m])}</td><td class="v">${brl(s[m])}</td><td class="v">${brl(e[m]-s[m])}</td><td class="v">${ac[m]==null?'—':brl(ac[m])}</td></tr>`).join('')}</tbody></table></div></details></section>
    <div class="duas">
      <section class="bloco cartao-graf"><div class="graf-cab"><h2>Resultado acumulado</h2></div>${grafAcumulado(ac)}</section>
      <section class="bloco cartao-graf"><div class="graf-cab"><h2>Para onde foram as despesas</h2></div>${grafCategorias(Object.entries(cat).sort((a,b)=>b[1]-a[1]), tS)}</section>
    </div>`;
  ligarTooltip($('#rsCorpo'));
}
